[project]
name = "agentic-workspace"
version = "1.0.0"
description = "Sandboxed AI coding agent harness: one command, many agents."
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
agentic-workspace = "agentic_workspace.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_workspace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
